<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Nothing is fetched and nothing is evaluated: the only script is the one
         beside this file, and the only images are the data: thumbnails the main
         process captured. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'"
    />
    <title>Choose what to share</title>
    <style>
      :root {
        --bg: #fff;
        --bg-raised: #f5f5f7;
        --text: #16171a;
        --text-muted: #5a5d63;
        --border: #d7d9de;
        --brand: #7b2ff7;
        --on-brand: #fff;
        --shadow: 0 1px 3px rgb(0 0 0 / 0.14);
      }
      :root[data-theme="dark"] {
        --bg: #1a1b1f;
        --bg-raised: #232429;
        --text: #f2f3f5;
        --text-muted: #9a9ea6;
        --border: #34363c;
        --shadow: 0 1px 3px rgb(0 0 0 / 0.5);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      header { flex: none; padding: 16px 20px 4px; }
      header h1 { margin: 0; font-size: 16px; font-weight: 600; }
      header p { margin: 4px 0 0; color: var(--text-muted); font-size: 13px; }
      #root { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 16px; }
      #root h2 {
        margin: 16px 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px;
        border: 2px solid transparent;
        border-radius: 8px;
        background: var(--bg-raised);
        color: inherit;
        font: inherit;
        text-align: start;
        cursor: pointer;
      }
      .tile:hover { border-color: var(--border); }
      .tile:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .tile[data-selected="true"] { border-color: var(--brand); }
      .shot {
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 4px;
        background: rgb(0 0 0 / 0.25);
      }
      .shot img { max-width: 100%; max-height: 100%; object-fit: contain; }
      .label { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .label .icon { width: 16px; height: 16px; flex: none; }
      .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .empty { color: var(--text-muted); text-align: center; padding: 32px 0; }
      footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }
      #soundRow { display: flex; align-items: center; gap: 6px; margin-inline-end: auto; font-size: 13px; }
      #soundRow[hidden] { display: none; }
      button.action {
        padding: 7px 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-raised);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.action:hover { border-color: var(--text-muted); }
      button.primary { border-color: transparent; background: var(--brand); color: var(--on-brand); }
      button.primary:disabled { opacity: 0.5; cursor: default; }
      button.action:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Choose what to share</h1>
      <p>Everyone in the call will see the screen or window you pick, until you stop sharing.</p>
    </header>
    <main id="root"></main>
    <footer>
      <label id="soundRow" hidden><input type="checkbox" id="sound" checked /> Share this computer's sound</label>
      <button type="button" class="action" id="cancel">Cancel</button>
      <button type="button" class="action primary" id="share" disabled>Share</button>
    </footer>
    <script src="./picker-ui.js"></script>
  </body>
</html>
