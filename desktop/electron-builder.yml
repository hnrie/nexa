appId: xyz.evilion.chat
productName: Nexa
copyright: Copyright © 2026 Evilion
directories:
  output: dist
  buildResources: resources
files:
  - dist-app/**
  - package.json
  - "!node_modules/**"
extraResources:
  - from: resources
    to: .
    filter:
      - tray*.png
      - trayTemplate*.png
      - badge.png
      - icon.png
asar: true
compression: maximum
artifactName: "nexa-${version}-${os}-${arch}.${ext}"
publish:
  provider: generic
  url: https://nexa.fish/desktop/
  channel: latest
mac:
  category: public.app-category.social-networking
  icon: resources/icon.png
  # Not signed, not even ad-hoc: the Apple identity is long gone, and updates
  # are checked against the release's checksum instead (src/main/update/mac.ts).
  # Electron's own executables keep the signatures they were built with, which
  # is what Apple silicon needs to run them.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  extendInfo:
    NSMicrophoneUsageDescription: Nexa uses the microphone for voice calls.
    NSCameraUsageDescription: Nexa uses the camera for video calls.
    NSAudioCaptureUsageDescription: Nexa shares the sound of what you share on screen.
dmg:
  artifactName: "nexa-${version}-mac-${arch}.${ext}"
win:
  icon: resources/icon.png
  # koffi's native module, which finds a shared window's program (src/main/appAudio.ts)
  extraResources:
    - from: resources/koffi/win32_x64
      to: koffi/win32_x64
  target:
    - target: nsis
      arch: [x64]
  artifactName: "nexa-Setup-${version}-win-${arch}.${ext}"
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Nexa
linux:
  icon: resources/icon.png
  category: Network;Chat;InstantMessaging
  executableName: nexa
  maintainer: Evilion <evilionx3@proton.me>
  synopsis: Nexa for your computer
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  desktop:
    entry:
      StartupWMClass: nexa
