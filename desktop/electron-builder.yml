appId: xyz.evilion.chat
productName: Nexa
copyright: Copyright © 2026 Evilion
directories:
  output: dist
  buildResources: resources
files:
  - dist-app/**
  - package.json
  - "!node_modules/**"
extraResources:
  - from: resources
    to: .
    filter:
      - tray*.png
      - trayTemplate*.png
      - badge.png
      - icon.png
asar: true
compression: maximum
artifactName: "nexa-${version}-${os}-${arch}.${ext}"
publish:
  provider: generic
  url: https://nexa.fish/desktop/
  channel: latest
# signs the Mac app ad hoc as it is packed, on Linux too (sign-mac.cjs)
afterPack: ./sign-mac.cjs
mac:
  category: public.app-category.social-networking
  icon: resources/icon.png
  # No Apple identity: the one there was is long gone, so electron-builder
  # signs nothing itself and sign-mac.cjs signs ad hoc instead. Without that
  # macOS calls the downloaded app damaged, since Electron's binaries carry only
  # the linker's stub signatures. Updates are checked against the release's
  # authenticated manifest checksum (src/main/update/mac.ts). On Linux, tools/mac_package.py checks the
  # signatures and makes the zips and disk images.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  extendInfo:
    NSMicrophoneUsageDescription: Nexa uses the microphone for voice calls.
    NSCameraUsageDescription: Nexa uses the camera for video calls.
    NSAudioCaptureUsageDescription: Nexa shares the sound of what you share on screen.
dmg:
  artifactName: "nexa-${version}-mac-${arch}.${ext}"
win:
  icon: resources/icon.png
  # koffi's native module, which finds a shared window's program (src/main/appAudio.ts)
  extraResources:
    - from: resources/koffi/win32_x64
      to: koffi/win32_x64
  target:
    - target: nsis
      arch: [x64]
  artifactName: "nexa-Setup-${version}-win-${arch}.${ext}"
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Nexa
linux:
  icon: resources/icon.png
  category: Network;Chat;InstantMessaging
  executableName: nexa
  maintainer: Nexa <evilionx3@proton.me>
  synopsis: Nexa for your computer
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  desktop:
    entry:
      StartupWMClass: nexa
