# The Xcode project for the simulator driver, made with `xcodegen generate`
# (tools/ios_sim.py does it). Nothing here ships: it only runs in a simulator.
name: SimDriver
options:
  bundleIdPrefix: xyz.evilion.simdriver
  deploymentTarget:
    iOS: "17.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.evilion.simdriver.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
  Runner:
    type: bundle.ui-testing
    platform: iOS
    sources: [Runner]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.evilion.simdriver.runner
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Runner:
    build:
      targets:
        Host: all
        Runner: [test]
    test:
      targets: [Runner]
